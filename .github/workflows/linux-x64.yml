name: Linux x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  build:
    # Compilation is always required; `--skip-tests` only suppresses downstream test jobs.
    name: Build - PHP ${{ matrix.php }} ZTS
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      PHPX_HOME: ${{ github.workspace }}/third_party/phpx

    steps:
      - name: Checkout TypePHP
        uses: actions/checkout@v4

      - name: Checkout PHPX master
        uses: actions/checkout@v4
        with:
          repository: swoole/phpx
          ref: master
          path: third_party/phpx

      - name: Checkout phpy
        uses: actions/checkout@v4
        with:
          repository: swoole/phpy
          path: third_party/phpy

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: precision=17, memory_limit=4G, error_reporting=E_ERROR|E_WARNING, display_errors=1, display_startup_errors=1, log_errors=0
          tools: composer:v2
        env:
          fail-fast: true
          phpts: ts
          update: true

      - name: Show PHP environment
        shell: bash
        run: |
          php -v
          php-config --version
          php --ini
          php -r 'printf("PHP_ZTS=%d\nopcache.enable=%s\nopcache.enable_cli=%s\nopcache.jit=%s\nopcache.jit_buffer_size=%s\npcre.jit=%s\n", PHP_ZTS, ini_get("opcache.enable"), ini_get("opcache.enable_cli"), ini_get("opcache.jit"), ini_get("opcache.jit_buffer_size"), ini_get("pcre.jit"));'

      - name: Verify ZTS PHP
        shell: bash
        run: |
          php -r 'if (!PHP_ZTS) { fwrite(STDERR, "Expected a ZTS PHP build\n"); exit(1); }'
          case "$(php -r 'echo PHP_VERSION;')" in
            "${{ matrix.php }}"*) ;;
            *) echo "setup-php installed an unexpected PHP version" >&2; exit 1 ;;
          esac

      - name: Patch php_hash.h C++ compatibility
        uses: ./.github/actions/patch-php-headers

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev libmpfr-dev pkg-config python3-dev

      - name: Configure ZTS PHP embed library
        shell: bash
        run: |
          php_home="$(php-config --prefix)"
          embed_library="${php_home}/lib/libphp.so"
          test -x "${php_home}/bin/php-config"
          test -f "${embed_library}"
          echo "PHP_HOME=${php_home}" >> "${GITHUB_ENV}"
          echo "Using ZTS PHP $(php-config --version) embed library: ${embed_library}"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Build PHPX
        shell: bash
        run: |
          cmake -S "${PHPX_HOME}" -B "${PHPX_HOME}/build" \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=OFF \
            -D BUILD_EXT=OFF \
            -D GITHUB_ACTION=ON \
            -D php_dir="${PHP_HOME}"
          cmake --build "${PHPX_HOME}/build" --target phpx --parallel 2
          test -f "${PHPX_HOME}/lib/libphpx.so"

      - name: Build phpy
        working-directory: third_party/phpy
        run: |
          phpize
          ./configure
          make -j2
          test -f modules/phpy.so

      - name: Enable phpy extension
        shell: bash
        run: |
          php_ini_dir="$(php-config --ini-dir)"
          {
            echo "extension=${GITHUB_WORKSPACE}/third_party/phpy/modules/phpy.so"
            echo "phpy.enable_operator_overloading=0"
          } | sudo tee "${php_ini_dir}/90-phpy.ini"
          echo "PHP_INI_SCAN_DIR=${php_ini_dir}" >> "${GITHUB_ENV}"
          php --ri phpy

      - name: Configure native library path
        shell: bash
        run: echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:${PHP_HOME}/lib" >> "${GITHUB_ENV}"

      - name: Build tpc
        shell: bash
        run: |
          php bin/tpc.php project.yml --job 2 --no-progress
          test -x ./tpc
          file ./tpc
          file ./tpc | grep -Eiq 'x86-64|x86_64|amd64'
          ./tpc --version

      - name: Upload Linux x64 build outputs
        uses: actions/upload-artifact@v4
        with:
          name: tpc-linux-x64-php-${{ matrix.php }}-zts
          if-no-files-found: error
          retention-days: 7
          path: |
            tpc
            third_party/phpx/lib/libphpx.so
            third_party/phpx/include/**
            third_party/phpx/src/misc/**
            third_party/phpx/thirdparty/opcache/**
            third_party/phpx/thirdparty/mpdecimal/libmpdec/**
            third_party/phpx/thirdparty/mpdecimal/libmpdec++/**
            third_party/phpy/modules/phpy.so

  phpunit:
    name: PHPUnit - PHP ${{ matrix.php }} ZTS
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message || '', '--skip-tests') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      PHPX_HOME: ${{ github.workspace }}/third_party/phpx

    steps:
      - name: Checkout TypePHP
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, redis, mbstring, ffi
          ini-values: ffi.enable=1, phpy.enable_operator_overloading=0, precision=17, memory_limit=4G, error_reporting=E_ERROR|E_WARNING, display_errors=1, display_startup_errors=1, log_errors=0
          tools: composer:v2
        env:
          fail-fast: true
          phpts: ts
          update: true

      - name: Show PHP environment
        shell: bash
        run: |
          php -v
          php-config --version
          php --ini
          php -r 'printf("PHP_ZTS=%d\nopcache.enable=%s\nopcache.enable_cli=%s\nopcache.jit=%s\nopcache.jit_buffer_size=%s\npcre.jit=%s\n", PHP_ZTS, ini_get("opcache.enable"), ini_get("opcache.enable_cli"), ini_get("opcache.jit"), ini_get("opcache.jit_buffer_size"), ini_get("pcre.jit"));'

      - name: Verify ZTS PHP
        shell: bash
        run: |
          php -r 'if (!PHP_ZTS) { fwrite(STDERR, "Expected a ZTS PHP build\n"); exit(1); }'
          case "$(php -r 'echo PHP_VERSION;')" in
            "${{ matrix.php }}"*) ;;
            *) echo "setup-php installed an unexpected PHP version" >&2; exit 1 ;;
          esac

      - name: Patch php_hash.h C++ compatibility
        uses: ./.github/actions/patch-php-headers

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev libmpfr-dev pkg-config python3-dev

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Download Linux x64 build outputs
        uses: actions/download-artifact@v4
        with:
          name: tpc-linux-x64-php-${{ matrix.php }}-zts
          path: .

      - name: Verify Linux x64 build outputs
        shell: bash
        run: |
          test -f ./tpc
          test -f "${PHPX_HOME}/lib/libphpx.so"
          test -f third_party/phpy/modules/phpy.so
          chmod +x ./tpc
          file ./tpc | grep -Eiq 'x86-64|x86_64|amd64'

      - name: Enable phpy extension
        shell: bash
        run: |
          php_ini_dir="$(php-config --ini-dir)"
          {
            echo "extension=${GITHUB_WORKSPACE}/third_party/phpy/modules/phpy.so"
            echo "phpy.enable_operator_overloading=0"
          } | sudo tee "${php_ini_dir}/90-phpy.ini"
          echo "PHP_INI_SCAN_DIR=${php_ini_dir}" >> "${GITHUB_ENV}"
          php --ri phpy

      - name: Configure native library path
        shell: bash
        run: echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:$(php-config --prefix)/lib" >> "${GITHUB_ENV}"

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  integration:
    name: EXT/LIB - PHP ${{ matrix.php }} ZTS
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message || '', '--skip-tests') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    env:
      PHPX_HOME: ${{ github.workspace }}/third_party/phpx

    steps:
      - name: Checkout TypePHP
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: precision=17, memory_limit=4G, error_reporting=E_ERROR|E_WARNING, display_errors=1, display_startup_errors=1, log_errors=0
          tools: composer:v2
        env:
          fail-fast: true
          phpts: ts
          update: true

      - name: Show PHP environment
        shell: bash
        run: |
          php -v
          php-config --version
          php --ini
          php -r 'printf("PHP_ZTS=%d\nopcache.enable=%s\nopcache.enable_cli=%s\nopcache.jit=%s\nopcache.jit_buffer_size=%s\npcre.jit=%s\n", PHP_ZTS, ini_get("opcache.enable"), ini_get("opcache.enable_cli"), ini_get("opcache.jit"), ini_get("opcache.jit_buffer_size"), ini_get("pcre.jit"));'

      - name: Verify ZTS PHP and FPM
        shell: bash
        run: |
          php -r 'if (!PHP_ZTS) { fwrite(STDERR, "Expected a ZTS PHP build\n"); exit(1); }'
          case "$(php -r 'echo PHP_VERSION;')" in
            "${{ matrix.php }}"*) ;;
            *) echo "setup-php installed an unexpected PHP version" >&2; exit 1 ;;
          esac
          php_home="$(php-config --prefix)"
          php_fpm=""
          for candidate in \
            "${php_home}/sbin/php-fpm" \
            "${php_home}/bin/php-fpm" \
            "/usr/sbin/php-fpm${{ matrix.php }}" \
            "/usr/bin/php-fpm${{ matrix.php }}"; do
            if test -x "${candidate}"; then
              php_fpm="${candidate}"
              break
            fi
          done
          test -n "${php_fpm}"
          "${php_fpm}" -v
          "${php_fpm}" -i > /tmp/typephp-fpm-info.txt
          grep -q 'Thread Safety => enabled' /tmp/typephp-fpm-info.txt
          echo "PHP_HOME=${php_home}" >> "${GITHUB_ENV}"
          echo "PHP_FPM=${php_fpm}" >> "${GITHUB_ENV}"

      - name: Patch php_hash.h C++ compatibility
        uses: ./.github/actions/patch-php-headers

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev libmpfr-dev pkg-config

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Download Linux x64 build outputs
        uses: actions/download-artifact@v4
        with:
          name: tpc-linux-x64-php-${{ matrix.php }}-zts
          path: .

      - name: Verify integration build inputs
        shell: bash
        run: |
          test -f ./tpc
          test -f "${PHPX_HOME}/lib/libphpx.so"
          test -f third_party/phpy/modules/phpy.so
          test -f "${PHP_HOME}/lib/libphp.so"
          chmod +x ./tpc
          echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:${PHP_HOME}/lib" >> "${GITHUB_ENV}"

      - name: Enable phpy extension for compiler
        shell: bash
        run: |
          php_ini_dir="$(php-config --ini-dir)"
          {
            echo "extension=${GITHUB_WORKSPACE}/third_party/phpy/modules/phpy.so"
            echo "phpy.enable_operator_overloading=0"
          } | sudo tee "${php_ini_dir}/90-phpy.ini"
          echo "TYPEPHP_COMPILER_INI_SCAN_DIR=${php_ini_dir}" >> "${GITHUB_ENV}"
          PHP_INI_SCAN_DIR="${php_ini_dir}" php --ri phpy

      - name: Run EXT/LIB integration tests
        shell: bash
        run: |
          php -n bin/run-integration-tests.php \
            --compiler=./tpc \
            --compiler-ini-scan-dir="${TYPEPHP_COMPILER_INI_SCAN_DIR}" \
            --php="$(command -v php)" \
            --php-fpm="${PHP_FPM}"

      - name: Upload integration failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failures-linux-x64-php-${{ matrix.php }}-zts
          if-no-files-found: ignore
          retention-days: 7
          path: build/integration-*

  phpt:
    name: PHPT - PHP ${{ matrix.php }} ZTS${{ matrix.sanitize && format(' ({0} sanitizer)', matrix.sanitize) || '' }}
    if: ${{ startsWith(github.ref, 'refs/tags/') || !contains(github.event.head_commit.message || '', '--skip-tests') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        # Empty means no sanitizer. The include below overrides it, so GitHub
        # adds a separate job instead of merging into the PHP 8.5 one.
        sanitize: [""]
        include:
          # Undefined behavior in the generated C++ (division by zero, shift
          # counts, signed overflow, misaligned access...) aborts the test binary.
          - php: "8.5"
            sanitize: undefined
    env:
      PHPX_HOME: ${{ github.workspace }}/third_party/phpx
      NO_INTERACTION: 1
      REPORT_EXIT_STATUS: 1
      TYPEPHP_PHPT_GENERATED_ARTIFACT_DIR: ${{ github.workspace }}/build/phpt-generated

    steps:
      - name: Checkout TypePHP
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, redis, mbstring, ffi
          ini-values: ffi.enable=1, phpy.enable_operator_overloading=0, precision=17, memory_limit=4G, error_reporting=E_ERROR|E_WARNING, display_errors=1, display_startup_errors=1, log_errors=0
          tools: composer:v2
        env:
          fail-fast: true
          phpts: ts
          update: true

      - name: Show PHP environment
        shell: bash
        run: |
          php -v
          php-config --version
          php --ini
          php -r 'printf("PHP_ZTS=%d\nopcache.enable=%s\nopcache.enable_cli=%s\nopcache.jit=%s\nopcache.jit_buffer_size=%s\npcre.jit=%s\n", PHP_ZTS, ini_get("opcache.enable"), ini_get("opcache.enable_cli"), ini_get("opcache.jit"), ini_get("opcache.jit_buffer_size"), ini_get("pcre.jit"));'

      - name: Verify ZTS PHP
        shell: bash
        run: |
          php -r 'if (!PHP_ZTS) { fwrite(STDERR, "Expected a ZTS PHP build\n"); exit(1); }'
          case "$(php -r 'echo PHP_VERSION;')" in
            "${{ matrix.php }}"*) ;;
            *) echo "setup-php installed an unexpected PHP version" >&2; exit 1 ;;
          esac

      - name: Patch php_hash.h C++ compatibility
        uses: ./.github/actions/patch-php-headers

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev libmpfr-dev pkg-config python3-dev

      - name: Configure ZTS PHP embed library
        shell: bash
        run: |
          php_home="$(php-config --prefix)"
          embed_library="${php_home}/lib/libphp.so"
          test -x "${php_home}/bin/php-config"
          test -f "${embed_library}"
          echo "PHP_HOME=${php_home}" >> "${GITHUB_ENV}"
          echo "Using ZTS PHP $(php-config --version) embed library: ${embed_library}"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Download Linux x64 build outputs
        uses: actions/download-artifact@v4
        with:
          name: tpc-linux-x64-php-${{ matrix.php }}-zts
          path: .

      - name: Verify Linux x64 build outputs
        shell: bash
        run: |
          test -f ./tpc
          test -f "${PHPX_HOME}/lib/libphpx.so"
          test -f third_party/phpy/modules/phpy.so
          chmod +x ./tpc
          file ./tpc | grep -Eiq 'x86-64|x86_64|amd64'

      - name: Enable phpy extension
        shell: bash
        run: |
          php_ini_dir="$(php-config --ini-dir)"
          {
            echo "extension=${GITHUB_WORKSPACE}/third_party/phpy/modules/phpy.so"
            echo "phpy.enable_operator_overloading=0"
          } | sudo tee "${php_ini_dir}/90-phpy.ini"
          echo "PHP_INI_SCAN_DIR=${php_ini_dir}" >> "${GITHUB_ENV}"
          php --ri phpy

      - name: Configure native library path
        shell: bash
        run: |
          test -f "${PHPX_HOME}/lib/libphpx.so"
          test -f "${PHP_HOME}/lib/libphp.so"
          echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:${PHP_HOME}/lib" >> "${GITHUB_ENV}"

      - name: Show build environment
        run: |
          ./tpc --version
          php -v
          php --ini
          ldd ./tpc | grep -E 'libphp(x)?[0-9.]*\.so'
          cmake --version
          c++ --version

      - name: Run compiler PHPT suite with bootstrap compiler
        shell: bash
        env:
          TYPEPHP_OBSERVED_BINARY: ./tpc
          TYPEPHP_TPC_METRICS_FILE: ${{ github.workspace }}/build/phpt-metrics/tpc-invocations.tsv
        run: |
          mkdir -p build/phpt-metrics
          .github/scripts/observe-command.sh build/phpt-metrics -- \
            php run-tests.php -q -j8 --compiler .github/scripts/observe-tpc.sh \
            ${{ matrix.sanitize && format('--sanitize {0}', matrix.sanitize) || '' }} \
            -w build/failed-tests.txt -W build/test-results.txt tests/compiler

      - name: Summarize PHPT compiler metrics
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/summarize-tpc-metrics.py \
            build/phpt-metrics/tpc-invocations.tsv \
            | tee build/phpt-metrics/tpc-invocations-summary.txt

      - name: Upload PHPT performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpt-metrics-linux-x64-php-${{ matrix.php }}-zts${{ matrix.sanitize && format('-{0}', matrix.sanitize) || '' }}
          if-no-files-found: warn
          retention-days: 14
          path: build/phpt-metrics

      - name: Package tested Linux compiler
        if: startsWith(github.ref, 'refs/tags/') && !matrix.sanitize
        shell: bash
        run: |
          composer install --no-dev --prefer-dist --no-progress --classmap-authoritative
          php bin/tpc.php project-release.yml --job 2 --no-progress
          test -x ./tpc
          ./tpc --version
          export TYPEPHP_PACKAGE_VERSION="${GITHUB_REF_NAME}"
          php package.php
          test "$(find . -maxdepth 1 -name 'tpc_v*_linux_x64_php${{ matrix.php }}.*-zts.tar.gz' -type f | wc -l)" -eq 1

      - name: Upload Linux release package
        if: startsWith(github.ref, 'refs/tags/') && !matrix.sanitize
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64-php-${{ matrix.php }}-zts
          if-no-files-found: error
          retention-days: 1
          path: tpc_v*_linux_x64_php${{ matrix.php }}.*-zts.tar.gz

      - name: Upload PHPT failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpt-failures-linux-x64-php-${{ matrix.php }}-zts${{ matrix.sanitize && format('-{0}', matrix.sanitize) || '' }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/failed-tests.txt
            build/test-results.txt
            build/**/*.cc
            build/**/*.h
            php_test_results_*.txt
            tests/compiler/**/*.diff
            tests/compiler/**/*.log
            tests/compiler/**/*.out
